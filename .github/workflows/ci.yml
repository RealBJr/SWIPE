name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build App (Web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: swipe

    env:
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      EXPO_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-0000000000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: swipe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx expo export --platform web
